[project]
name = "server"
version = "0.1.0"
description = "Webcam intrusion detection MVP — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "opencv-python>=4.10.0",
    "ultralytics>=8.3.0",
    "supervision>=0.25.0",
    "shapely>=2.0.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
